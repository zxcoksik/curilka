<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Каталог товаров">
  <title>CATALOG — каталог</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="header">
  <div class="container">
    <div class="topbar">
      <a class="brand" href="./" aria-label="CATALOG">
        <span class="brand-mark">C</span>
        <span>
          <strong>CATALOG</strong>
          <small>Внутренний каталог</small>
        </span>
      </a>
      <div class="header-actions">
        <button id="clearSearch" class="icon-btn" type="button" aria-label="Очистить поиск" title="Очистить поиск">×</button>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Переключить тему" title="Переключить тему">☼</button>
      </div>
    </div>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" class="search" type="search" autocomplete="off"
             enterkeyhint="search" placeholder="Поиск по названию, артикулу или бренду…">
      <kbd>Ctrl K</kbd>
    </div>

    <div class="toolbar">
      <div id="categories" class="categories" aria-label="Категории"></div>
      <label class="sort">
        <span>Сортировка</span>
        <select id="sort">
          <option value="default">По умолчанию</option>
          <option value="name">По названию</option>
          <option value="priceAsc">Цена: по возрастанию</option>
          <option value="priceDesc">Цена: по убыванию</option>
          <option value="article">По артикулу</option>
        </select>
      </label>
    </div>
  </div>
</header>

<main class="container main">
  <section class="intro">
    <div>
      <h1 id="title">Все товары</h1>
      <p id="counter" class="counter"></p>
    </div>
    <button id="resetBtn" class="reset-btn" type="button">Сбросить фильтры</button>
  </section>

  <section id="productGrid" class="grid" aria-live="polite"></section>
</main>

<div id="lightbox" class="lightbox" hidden>
  <button type="button" class="lightbox-close" aria-label="Закрыть">×</button>
  <button type="button" class="lightbox-prev" aria-label="Предыдущий товар">‹</button>
  <div class="lightbox-content">
    <img id="lightboxImage" alt="">
    <div id="lightboxCaption" class="lightbox-caption"></div>
  </div>
  <button type="button" class="lightbox-next" aria-label="Следующий товар">›</button>
</div>

<script src="assets/js/products.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
